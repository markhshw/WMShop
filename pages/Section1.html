<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/scss/pages/Section1.css" />
    <title>熱銷商品</title>
  </head>
  <body>
    <section class="HotSaleSec pb-11">
      <img
        src="../assets/images/index/paw- outlined.png"
        alt="PawOuline"
        class="PawOuline position-absolute"
      />
      <div class="container">
        <!-- 標題列 -->
        <div class="HotSaleText mb-10 position-relative">
          <div class="HSTitle text-center">
            <svg
              width="15"
              height="28"
              viewBox="0 0 15 28"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              class="position-absolute OrLeft"
            >
              <path
                d="M1.5 2L13.5 26"
                stroke="#FE7F00"
                stroke-width="3"
                stroke-linecap="round"
              />
            </svg>
            <h3 class="mb-2 fs-3 fw-bold fs-md">熱銷商品</h3>
            <svg
              width="15"
              height="28"
              viewBox="0 0 15 28"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              class="position-absolute OrRight"
            >
              <path
                d="M13.5 2L1.5 26"
                stroke="#FE7F00"
                stroke-width="3"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <p class="fs-5 fw-normal text-center fs-md">最近主子們的心頭好</p>
        </div>
        <!-- flex-md-row flex-column -->
        <div
          class="HotSaleCont d-flex row justify-content-center align-items-center"
        >
          <!-- Hot Sale Top 1 -->
          <div class="HotSaleTop1 text-center col-12 col-md-6">
            <img
              src="../assets/images/index/Section1/image.png"
              alt="多重過濾寵物淨水器"
              class="mb-3"
            />
            <h5 class="mb-04">HEPA 多重過濾寵物飲水器</h5>
            <div class="HST1P d-flex justify-content-center align-items-center">
              <a href="#" class="btn-back">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="40"
                  height="40"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M15 6l-6 6l6 6" />
                </svg>
              </a>

              <p class="HST1C fs-5 fw-normal">
                過濾重金屬元素 95%，讓主子愉快補水
              </p>
              <a href="#" class="btn-back">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="40"
                  height="40"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#000000"
                  stroke-width="1"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M9 6l6 6l-6 6" />
                </svg>
              </a>
            </div>
          </div>
          <!-- Hot Sale top 2+3 -->
          <div class="HotSaleSec col-12 col-md-6">
            <div class="HotSaleTop2 d-flex align-items-center m-42">
              <img
                src="../assets/images/index/Section1/image-1.png"
                alt="無穀飼料"
                class="me-5 SHT23"
              />
              <div class="HotSaleTop2Cont align-items-center me-5">
                <h5 class="mb-3 fs-5 fw-bold">無穀飼料</h5>
                <p class="fs-5 fw-normal">敏感腸胃首選 | 網友狂推 Top 1</p>
                <p></p>
              </div>
              <a href="#" class="btn-back">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="40"
                  height="40"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#000000"
                  stroke-width="1"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M9 6l6 6l-6 6" />
                </svg>
              </a>
            </div>

            <div class="HotSaleTop3 d-flex align-items-center">
              <img
                src="../assets/images/index/Section1/image-2.png"
                alt="無穀飼料"
                class="me-5 SHT23"
              />
              <div class="HotSaleTop3Cont me-5">
                <h5 class="mb-3 fs-5 fw-bold">頂級貓罐頭</h5>
                <p class="fs-5 fw-normal">點進來看看 | 這款太香了</p>
                <p></p>
              </div>
              <a href="#" class="btn-back">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="40"
                  height="40"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#000000"
                  stroke-width="1"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M9 6l6 6l-6 6" />
                </svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="../main.js"></script>
  </body>
</html>
