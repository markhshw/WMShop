<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>汪喵鋪</title>
</head>

<body>

  <main>


    <div class="bg-primary-1-01 py-9 py-md-11 position-relative overflow-hidden">


      <div class="container position-relative">

        <img src="/assets/images/about/heart.png" class="heartImg" alt="">
        <img src="/assets/images/about/heart-1.png" class="heartsImg" alt="">

        <div class="row d-flex justify-content-center align-items-center text-center flex-md-row-reverse mx-auto">

          <div class="col-md-6">
            <picture class="w-100">
              <source media="(max-width: 768px)" srcset="/assets/images/about/profile-sm.png" />
              <img src="/assets/images/about/profile.png" class="w-100" alt="#">
            </picture>

          </div>
          <div class="col-md-6">
            <p class="fs-4 fs-md-1 ls-5 lh-12  text-primary-1-05 text-center fw-bold mt-5 mb-3 mb-md-5">從汪星到喵星，都值得最好的寵愛
            </p>
            <p class="fs-6 fs-md-5 ls-2 pb-9 ">
              汪喵舖是一間為貓貓狗狗精心打造的寵物用品小舖，專門販售各種讓毛孩開心翻滾、主人安心使用的可愛好物，從主食、零食、玩具到保健品，嚴選全球好物，打造一個讓毛孩健康、開心成長的專屬商城</p>

          </div>
        </div>
      </div>


      <section class="bg-primary-1-02">
        <picture class="w-100 bg-primary-1-02">
          <source media="(max-width: 768px)" srcset="/assets/images/wave/waveRWD6.png" />
          <img class="w-100 d-block" src="/assets/images/wave/wave5.png" alt="#" />
        </picture>

        <div class="container position-relative pt-9 pb-12 py-md-11">

          <img src="/assets/images/about/dog.png" class="dogImg" alt="">
          <img src="/assets/images/about/cat.png" class="catImg" alt="">

          <h3 class="fs-5 fs-md-3 text-center mb-2 fw-bold">給毛孩的愛，一點都不能少<span class="text-primary-1-05">！</span></h3>
          <p class="fs-6 fs-md-5 text-center mb-6">為主子精心準備了...</p>

          <div class="container">
            <div class="row text-center">
              <div class="col-md-4">
                <div class="card bg-transparent border-0">
                  <h5 class="fs-6 fs-md-5 fw-bold bg-primary-1-02 mb-3">主食用品</h5>
                </div>
                <picture class="w-100">
                  <source media="(max-width: 768px)" srcset="/assets/images/about/image.png" />
                  <img src="/assets/images/about/image-sm.png" class="w-100 card-img-top mb-5" alt="#">
                </picture>
              </div>

              <div class="col-md-4">
                <div class="card bg-transparent border-0">
                  <h5 class="fs-6 fs-md-5 fw-bold bg-primary-1-02 mb-3">玩具/生活用品</h5>
                </div>
                <picture class="w-100">
                  <source media="(max-width: 768px)" srcset="/assets/images/about/image2.png" />
                  <img src="/assets/images/about/image2-sm.png" class="w-100 card-img-top mb-5" alt="#">
                </picture>
              </div>

              <div class="col-md-4">
                <div class="card bg-transparent border-0">
                  <h5 class="fs-6 fs-md-5 fw-bold bg-primary-1-02 mb-3">保健/醫療用品</h5>
                </div>
                <picture class="w-100">
                  <source media="(max-width: 768px)" srcset="/assets/images/about/image3.png" />
                  <img src="/assets/images/about/image3-sm.png" class="w-100 card-img-top mb-5" alt="#">
                </picture>
              </div>

              <div class="row justify-content-center text-center">
                <div class="col-md-4">
                  <div class="card bg-transparent border-0">
                    <h5 class="fs-6 fs-md-5 fw-bold bg-primary-1-02 mb-3">零食點心</h5>
                  </div>
                  <picture class="w-100">
                    <source media="(max-width: 768px)" srcset="/assets/images/about/image4.png" />
                    <img src="/assets/images/about/image4-sm.png" class="w-100 card-img-top mb-5" alt="#">
                  </picture>
                </div>

                <div class="col-md-4">
                  <div class="card bg-transparent border-0">
                    <h5 class="fs-6 fs-md-5 fw-bold bg-primary-1-02 mb-3">清潔/美容用品</h5>
                  </div>
                  <picture class="w-100">
                    <source media="(max-width: 768px)" srcset="/assets/images/about/image5.png" />
                    <img src="/assets/images/about/image5-sm.png" class="w-100 card-img-top mb-0" alt="#">
                  </picture>
                </div>
              </div>
            </div>
          </div>
        </div>
        <picture class="w-100 bg-primary-1-02">
          <source media="(max-width: 768px)" srcset="/assets/images/wave/waveRWD5.png" />
          <img class="w-100 d-block" src="/assets/images/wave/wave7.png" alt="#" />
        </picture>
      </section>
  </main>


  <%- include('./layout/footer'); -%>

    <script type="module" src="../main.js"></script>
</body>

</html>
