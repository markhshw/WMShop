<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>所有商品｜汪喵鋪</title>
    </head>
    <body>
        <%- include('./layout/header'); -%>
        <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="#">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Library</li>
            </ol>
        </nav>
        <section class="proBanner position-relative">
            <div class="container">
                <div class="CarouselBox">
                    <div id="carouselExampleIndicators" class="carousel slide"  data-bs-ride="carousel">
                        <div class="carousel-indicators">
                        <button style=border-radius:100% type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                        <button style=border-radius:100% type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2" ></button>
                        <button style=border-radius:100% type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3" ></button>
                        </div>
                        <div class="carousel-inner">
                        <div class="carousel-item active">
                        <img src="../assets/images/products/pic=1.png" class="d-block w-80" alt="...">
                        </div>
                        <div class="carousel-item">
                        <img src="../assets/images/products/pic=2.png" class="d-block w-100" alt="...">
                        </div>
                        <div class="carousel-item">
                        <img src="../assets/images/products/pic=3.png" class="d-block w-100" alt="...">
                        </div>
                    </div>

                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev" >
                        <span class="carousel-control-prev-icon" aria-hidden="true" ></span>
                        <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next" >
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                        </button>
                        
                    </div>
                </div>
                
            </div>
            <img src="../assets/images/products/wave.png" alt="wave" class="w-100 position-absolute start-0 ProdBannerWave">
        </section>
        
        <!-- <%- include('./layout/footer'); -%> -->
        
        <script type="module" src="../main.js"></script>
    </body>
</html>
