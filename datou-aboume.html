        <h5 class="fw-bold mb-md-8 mb-3 fs-5 fs-md-3 text-white">歡迎光臨毛孩的天堂！</h5>
        <p class="mb-1 mb-md-2 fs-6 fs-md-5 text-primary-2-05 fw-normal">
          汪喵舖是一間為貓貓狗狗精心打造的寵物用品小舗，專門販售各種種讓毛孩開心翻滾、主人安心使用的可愛好物。
        </p>
        <p class="fs-6 fs-md-5 mb-5 text-primary-2-05 fw-normal">不管是喵星人愛的逗貓棒、汪星人最愛的零食小餅乾，還是舒舒服服的窩窩和造型配件，通通都找得到！</p>
        <p class="text-white textShadow fs-6 fs-md-4 fw-bold mb-1 mb-md-5">我們相信</p>
        <p class="text-primary-1-05 fw-bold fs-5 fs-md-2 mb-5">“毛孩不只是寵物，而是我們的家人“</p>

        <p class="fs-6 fs-md-5 text-primary-2-05 fw-normal mb-1 mb-md-2">所以每一樣商品，我們都像幫自家毛孩挑選一樣用心，希望每個家庭都能因為毛孩而更溫暖。</p>
        <p class="fs-6 fs-md-5 text-primary-2-05 fw-normal">
          雖然現在的汪喵舗還只是一個專題作品，但我們用滿滿的愛與創意，設計出一個夢想中的寵物品牌，想像著未來真的有一間可愛又溫馨的寵物店，陪伴你和毛孩每一天！</p>
