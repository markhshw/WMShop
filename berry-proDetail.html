<script>
  
  /**
   * 手機用：依容器寬度翻頁式捲動
   * @param {string} id - 容器 ID
   * @param {number} direction - -1 往左、1 往右
   */
  function scrollRow(id, direction) {
    const row = document.getElementById(id);
    const page = row.clientWidth;          // 以一個容器寬度為一頁
    row.scrollBy({ left: direction * page, behavior: 'smooth' });
  }
</script>
